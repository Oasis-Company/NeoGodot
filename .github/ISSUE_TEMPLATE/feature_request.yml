name: 功能请求
description: 建议一个新功能
title: "[Feature]: "
labels: ["enhancement"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        感谢你提出新功能建议！请提供尽可能详细的信息。

  - type: textarea
    id: problem
    attributes:
      label: 你的功能请求是关于什么问题？
      description: 清晰描述你想要解决的问题。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你想要什么解决方案？
      description: 描述你期望的功能或改进。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 有没有其他替代方案？
      description: 你考虑过其他替代方案吗？
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 更多上下文
      description: 提供任何其他相关的信息、截图或参考。
    validations:
      required: false
