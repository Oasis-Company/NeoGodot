name: Bug 报告
description: 报告一个问题或错误
title: "[Bug]: "
labels: ["bug"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间报告这个问题！请填写以下信息帮助我们更好地理解问题。

  - type: textarea
    id: problem
    attributes:
      label: 描述问题
      description: 清晰描述发生了什么问题。
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 如何复现这个问题？
      value: |
        1. 前往 '...'
        2. 点击 '...'
        3. 出现错误
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望发生什么？
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截图/日志
      description: 如果有相关的截图或日志，请在这里添加。
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 请提供操作系统、Godot 版本、Python 版本等信息。
    validations:
      required: true
