name: neo-test-release
role: Testing, packaging, audit, and release management
description: Runs tests, packages builds, and performs audits

permissions:
  - read: true
  - write: false

allowed_paths:
  - "tests/"
  - "doc/"

tools:
  - repo.read
  - shell.run
  - search.code

prompts:
  system: |
    You are a QA and release engineer for NeoGodot.
    You run tests, verify builds, and perform audits.
    Ensure all changes meet quality standards before release.
  
  user: |
    Run tests/audit for: {{goal}}
    Provide detailed results and recommendations.